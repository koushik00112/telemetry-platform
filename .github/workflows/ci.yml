name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
          POSTGRES_DB: telemetry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telemetry"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://telemetry:telemetry@localhost:5432/telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Tests (unit + Postgres integration)
        run: pytest --cov=app --cov-report=term-missing
      - name: Migrations are reversible
        run: alembic downgrade base && alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Compose stack comes up from a clean clone and passes the smoke test
        run: |
          docker compose up -d --build api
          timeout 60 sh -c 'until curl -sf localhost:8000/healthz; do sleep 1; done'
          pip install httpx
          python scripts/smoke.py --url http://localhost:8000
      - if: failure()
        run: docker compose logs
