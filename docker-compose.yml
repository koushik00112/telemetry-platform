name: telemetry-platform

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: telemetry-platform:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://telemetry:telemetry@db:5432/telemetry
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: telemetry-platform:local
    environment:
      DATABASE_URL: postgresql+psycopg://telemetry:telemetry@db:5432/telemetry
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    image: telemetry-platform:local
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://telemetry:telemetry@db:5432/telemetry
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Observability stack: docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
